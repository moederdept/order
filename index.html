<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Toko</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f4f4; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 8px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; border-radius: 8px; object-fit: cover; aspect-ratio: 1/1; background: #eee; }
        .card h3 { margin: 10px 0 5px; }
        .card p { color: #666; font-size: 14px; margin-bottom: 10px; }
        .card select, .card input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-wa { background: #25D366; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Katalog Produk</h1>
        <p>Pilih produk dan pesan langsung via WhatsApp</p>
    </div>

    <!-- CONTOH PRODUK 1 -->
    <div class="card">
        <!-- Nanti gambar buatanmu dipanggil di sini -->
        <img src="https://via.placeholder.com/300x300?text=Foto+Produk" alt="Butterscotch">
        <h3>Butterscotch</h3>
        <p>Rp 20.000</p>
        
        <label for="variant1">Varian / Sugar:</label>
        <select id="variant1">
            <option value="Normal Sugar">Normal Sugar</option>
            <option value="Less Sugar">Less Sugar</option>
        </select>

        <label for="qty1">Jumlah:</label>
        <input type="number" id="qty1" value="1" min="1">

        <button class="btn-wa" onclick="pesanWa('Butterscotch', 'variant1', 'qty1')">Pesan via WA</button>
    </div>

    <script>
        // MASUKKAN NOMOR HP WA KAMU DI SINI (Ganti 6285776100168)
        const nomorWA = "6285776100168"; 

        function pesanWa(namaProduk, idVarian, idQty) {
            const varian = document.getElementById(idVarian).value;
            const qty = document.getElementById(idQty).value;
            
            // Format Pesan
            const teks = `Halo, saya mau pesan ${namaProduk} ${qty} (${varian})`;
            
            // Buka link WhatsApp
            const url = `https://wa.me/${nomorWA}?text=${encodeURIComponent(teks)}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
